name: URL Integrity

on:
  schedule:
    # Tuesday 4:00 AM AEST = Monday 18:00 UTC
    - cron: '0 18 * * 1'
  workflow_dispatch:

jobs:
  url-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm url-integrity --all
